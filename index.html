  .channel{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;cursor:pointer}

  .toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
</style>

(P("sp") ?? DEFAULTS.sp).split(",").filter(Boolean).forEach(x => { const [d,v] = x.split(":"); if (d && +v) SPECIAL[d] = +v; });

const OPENS = (openRaw || "").split(";").filter(x => x.includes("..")).map(x => { const [a,b] = x.split(".."); return { from:a.slice(0,10), fromT:a.slice(11,16), to:b.slice(0,10), toT:b.slice(11,16) }; });
const LIMITED = openRaw === "none" || OPENS.length > 0;  // "none" = hech qaysi kun ochiq emas
const winOf = d => OPENS.find(w => d >= w.from && d < w.to);
const HOURS = (params.get("hrs") || "").split(",").filter(x => x.trim() !== "").map(Number).filter(h => h >= 0 && h <= 23);
if (!HOURS.length) HOURS.push(...DEFAULTS.hours);
const hoursText = () => { const h = HOURS; return (h.at(-1)-h[0] === h.length-1) ? `${pad(h[0])}:00 – ${pad(h.at(-1))}:00` : h.map(x => pad(x)+":00").join(", "); };
if (!inTelegram && !location.search) { // brauzer sinovi: namunaviy holat
  const t = new Date(); [3,4,9].forEach(k => { const d = new Date(t); d.setDate(t.getDate()+k); booked.add(iso(d)); });
}

const today = new Date(); today.setHours(0,0,0,0);
const TODAY = iso(today);
const priceOf = d => SPECIAL[d] ?? ([0,6].includes(parseIso(d).getDay()) ? WE : WD);
const tierOf = p => { const u = [...new Set([WD, WE, ...Object.values(SPECIAL)])].sort((x,y)=>x-y); if (u.length < 2) return 1; const r = u.indexOf(p)/(u.length-1); return r < 0.34 ? 0 : r < 0.67 ? 1 : 2; };
const isWeekend = d => [0,6].includes(parseIso(d).getDay());
const nightFree = d => d >= TODAY && !booked.has(d) && !(LIMITED && !winOf(d));

const firstFree = (() => { for (let i=0;i<400;i++){ const d = addDays(TODAY,i); if (nightFree(d)) return d; } return null; })();
const state = { days:new Set(), time:null,

/* end tanlash mumkin bo'lgan kunlar: start dan keyin, oraliqdagi barcha sutkalar bo'sh */
function returnable(start){

}

/* tanlangan kunlarni ketma-ket bloklarga ajratish: [{from, to(qaytarish kuni), n}] */
function blocks(){
  const out = []; let cur = null;
  state.sorted.forEach(d => {
    if (cur && addDays(cur.last,1) === d) { cur.last = d; cur.n++; }
    else { cur = { from:d, last:d, n:1 }; out.push(cur); }
  });
  out.forEach(b => b.to = addDays(b.last,1));
  return out;
}

               <div class="rate we"><small>${L.we}</small><b>${fmt(WE)} <em>${L.perDay}</em></b></div>`;
  if (futureSp.length) {
    const vals = [...new Set(futureSp.map(d => SPECIAL[d]))];
    const range = futureSp.length > 1 ? `${parseIso(futureSp[0]).getDate()}–${human(futureSp.at(-1)).split(",")[0]}` : human(futureSp[0]).split(",")[0];

  $("pillTxt").textContent = firstFree ? L.freeNow : L.noFree;

}

function renderCalendar(){
  const v = state.view, y = v.getFullYear(), m = v.getMonth();
  $("monthTitle").textContent = L.months[m] + " " + y;
  const minV = new Date(today.getFullYear(), today.getMonth(), 1);
  const maxV = new Date(today.getFullYear(), today.getMonth()+DEFAULTS.monthsAhead-1, 1);
  $("prev").disabled = v <= minV; $("next").disabled = v >= maxV;
  const first = (new Date(y,m,1).getDay()+6)%7, days = new Date(y,m+1,0).getDate();
  const sel = state.days;
  const retDays = new Set(blocks().map(b => b.to));
  let html = L.dow.map((d,i)=>`<div class="dow ${i>4?"we":""}">${d}</div>`).join("");
  for (let i=0;i<first;i++) html += "<div></div>";
  for (let d=1; d<=days; d++){
    const s = iso(new Date(y,m,d)); const p = priceOf(s);
    let cls = "day", click = false, sub = "";
    if (s < TODAY) cls += " past";
    else if (sel.has(s)) { cls += " sel"; click = true; sub = short(p); }
    else if (retDays.has(s)) { cls += " ret"; click = nightFree(s); sub = "↩"; }
    else if (nightFree(s)) { cls += " free t"+tierOf(p); click = true; sub = short(p); }
    else cls += " busy";
    if (s === TODAY) cls += " today";
    html += `<div class="${cls}" ${click?`data-d="${s}"`:""}>${d}${sub?`<span class="pr">${sub}</span>`:""}</div>`;
  }
  $("grid").innerHTML = html;
  document.querySelectorAll(".day[data-d]").forEach(el => el.onclick = () => pickDay(el.dataset.d));
  $("hint").textContent = !state.days.size ? L.hint0 : L.hint1;
}

function rangeFree(a, b){ for (let d=a; d<=b; d=addDays(d,1)) if (!nightFree(d)) return false; return true; }

function pickDay(s){
  haptic("sel");
  let anim = "";
  if (state.days.has(s)) { state.days.delete(s); anim = "unflip"; }   // qayta bosildi → bekor
  else if (nightFree(s)) { state.days.add(s); anim = "flip"; }       // bo'sh kun → tanlandi
  renderCalendar(); renderTimes(); renderSummary();
  const el = document.querySelector(`.day[data-d="${s}"]`);
  if (el && anim) el.classList.add(anim);
}

function calc(){
  if (!state.days.size) return { nights:[], total:0, groups:[] };
  const n = state.sorted;
  const groups = {};
  n.forEach(d => { const p = priceOf(d); const k = (d in SPECIAL) ? "sp" : (isWeekend(d) ? "we" : "wd"); const key = k+":"+p; groups[key] = groups[key] || {k, p, c:0}; groups[key].c++; });
  return { nights:n, total:n.reduce((a,d)=>a+priceOf(d),0), groups:Object.values(groups) };
}

function validTimes(){
  if (!state.days.size) return [];
  const now = new Date(), nowH = now.getHours(), bl = blocks();
  return HOURS.map(h => pad(h)+":00").filter(t => bl.every(b => {
    const w = winOf(b.from);
    if (w && b.from === w.from && t < w.fromT) return false;
    if (w && b.to === w.to && t > w.toT) return false;
    if (b.from === TODAY && +t.slice(0,2) <= nowH) return false;
    return true;
  }));
}
function renderTimes(){
  const sec = $("timeSec");
  if (!state.days.size) { sec.style.display = "none"; state.time = null; return; }
  sec.style.display = "";
  const ts = validTimes();
  if (!ts.includes(state.time)) state.time = ts.includes("10:00") ? "10:00" : (ts[0] || null);
  const groups = [[8,11],[12,17],[18,23]];
  $("times").innerHTML = groups.map((g,i) => {
    const items = ts.filter(t => +t.slice(0,2) >= g[0] && +t.slice(0,2) <= g[1]);
    if (!items.length) return "";
    return `<div class="tgrp" style="grid-column:1/-1">${L.period[i]}</div>` + items.map(t => `<button class="time ${t===state.time?"on":""}" data-t="${t}">${t}</button>`).join("");
  }).join("");
  document.querySelectorAll(".time").forEach(b => b.onclick = () => { haptic("sel"); state.time = b.dataset.t; renderTimes(); renderSummary(); });
  $("tnote").textContent = ts.length ? L.tNote.replace("{d}", blocks().map(b => human(b.to).split(",")[0]).join(", ")).replace("{h}", state.time) : L.tNone;
}
function renderSummary(){
  const c = calc();
  const bl = blocks(), tm = state.time ? " " + state.time : "";
  const sh = d => human(d).split(",")[0];
  $("sPick").innerHTML = bl.length ? bl.map(b => sh(b.from) + tm).join("<br>") : "—";
  $("sRet").innerHTML = bl.length ? bl.map(b => sh(b.to) + tm).join("<br>") : "—";
  $("sNights").textContent = c.nights.length + " " + L.nights;
  if (c.nights.length) {
    $("calc").style.display = "block";
    $("calc").innerHTML = c.groups.map(g => `<div><span>${g.c} × ${fmt(g.p)} <small style="color:var(--muted)">(${g.k==="sp"?"⭐ "+L.sp:(g.k==="we"?L.we:L.wd)})</small></span><span>${fmt(g.c*g.p)}</span></div>`).join("");
  } else $("calc").style.display = "none";
  $("sPay").textContent = (state.pay==="cash" ? L.payCash : L.payCard) + " · " + L.payNote;
  $("sDeliveryRow").style.display = state.delivery==="delivery" ? "" : "none";
  $("sTotal").textContent = fmt(c.total);
  const ready = c.nights.length && state.time;
  const label = ready ? `${L.btnOrder}  •  ${fmt(c.total)}` : (c.nights.length ? L.eTime : L.btnPick);
  if (inTelegram) {
    // matn, rang va holatni bitta chaqiruvda yangilaymiz (aks holda Telegram eski summani ko'rsatib qolishi mumkin)
    tg.MainButton.setParams({ text: label, color: ready ? "#2f8cff" : "#252b38", text_color: ready ? "#ffffff" : "#6b7488", is_active: !!ready, is_visible: true });
  } else { $("bar").style.display = "block"; $("fallbackBtn").textContent = label; $("fallbackBtn").disabled = !ready; }
}

function submit(){
  const c = calc();
  const name = $("name").value.trim(), phone = $("phone").value.trim(), address = $("address").value.trim();
  if (!c.nights.length) return toast(L.eDays);
  if (!state.time) return toast(L.eTime);
  if (name.length < 2) { $("name").focus(); return toast(L.eName); }
  if (phone.replace(/\D/g,"").length < 9) { $("phone").focus(); return toast(L.ePhone); }
  if (state.delivery==="delivery" && address.length < 5) { $("address").focus(); return toast(L.eAddr); }
  haptic("success");
  const order = { lang:LANG, product:"ps5", start:state.start, end:state.end, dates:state.sorted, days:c.nights.length, pick_time:state.time, ret_time:state.time,
                  delivery:state.delivery, pay:state.pay, address, name, phone, comment:$("comment").value.trim().slice(0,300), total:c.total };
  if (inTelegram) {
    try { tg.sendData(JSON.stringify(order)); }
    catch(e) { alert({uz:"Buyurtma yuborilmadi. Bot ichidagi pastki «🎮 Ijaraga olish» tugmasi orqali qayta oching.", ru:"Заказ не отправлен. Откройте заново через нижнюю кнопку «🎮 Арендовать» в боте.", en:"Order not sent. Please reopen via the bottom «🎮 Rent now» button in the bot."}[LANG] || "Error"); }
  }
  else alert("Brauzerda sinov rejimi. Telegram ichida bu buyurtma botga yuboriladi:\n\n" + JSON.stringify(order, null, 2));
}

/* ---------- hodisalar ---------- */
$("prev").onclick = () => { state.view = new Date(state.view.getFullYear(), state.view.getMonth()-1, 1); renderCalendar(); };
$("next").onclick = () => { state.view = new Date(state.view.getFullYear(), state.view.getMonth()+1, 1); renderCalendar(); };
document.querySelectorAll("#deliverySeg button").forEach(b => b.onclick = () => {
  haptic("sel");
  document.querySelectorAll("#deliverySeg button").forEach(x => x.classList.toggle("active", x===b));
  state.delivery = b.dataset.v; $("addressBox").style.display = state.delivery==="delivery" ? "" : "none"; renderSummary();
});
$("fallbackBtn").onclick = submit;
document.querySelectorAll("#paySeg button").forEach(b => b.onclick = () => {
  haptic("sel"); document.querySelectorAll("#paySeg button").forEach(x => x.classList.toggle("active", x===b));
  state.pay = b.dataset.v; renderSummary();
});
["channelCard","chTop"].forEach(id => $(id).onclick = e => { if (inTelegram && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink("https://t.me/ps_5_gta_6"); } });

const shareBtn = $("shareBtn");
if (inTelegram && typeof tg.requestContact === "function") {
  shareBtn.textContent = L.share; shareBtn.style.display = "flex";
  shareBtn.onclick = () => {
    haptic("sel");
    tg.requestContact((ok, res) => {
      const c = res && res.responseUnsafe && res.responseUnsafe.contact;
      if (ok && c && c.phone_number) {
        const ph = String(c.phone_number); $("phone").value = ph.startsWith("+") ? ph : "+" + ph;
        if (!$("name").value.trim()) $("name").value = [c.first_name, c.last_name].filter(Boolean).join(" ");
      }
      if (ok) { shareBtn.textContent = L.shared; shareBtn.classList.add("done"); haptic("success"); }
    });
  };
}

if (inTelegram) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#0b0d12"); tg.setBackgroundColor("#0b0d12"); tg.setBottomBarColor && tg.setBottomBarColor("#0b0d12"); } catch(e){}
  tg.MainButton.onClick(submit);
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) $("name").value = [u.first_name, u.last_name].filter(Boolean).join(" ");
}
renderStatic(); renderCalendar(); renderSummary();
</script>
