<!DOCTYPE html>

<head>

<title>PlayRent — PS5 ijarasi</title>

<style>
  :root{
    --bg:#0b0d12; --card:#151922; --card2:#1c212c; --card3:#252b38; --line:rgba(255,255,255,.07);
    --text:#f4f6fa; --muted:#8c95a8; --dim:#4c5467;
    --blue:#2f8cff; --blue2:#1f6fe0; --ok:#22c38e; --bad:#ff4d5e; --gold:#ffb547;
    --light:#f2f3f7;
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{color:var(--text);font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
  button{font-family:inherit}
  .wrap{padding:0 16px}

  /* header */
  .head{padding:18px 16px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .head h1{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .head h1 span{color:var(--blue)}
  .head p{color:var(--muted);font-size:13.5px;margin-top:4px}
  .chbtn{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none}

  /* product card (light photo area like a store) */
  .product{margin:14px 16px 0;border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
  .photo{position:relative;height:250px;background:radial-gradient(120% 90% at 50% 35%,#ffffff 0%,#eceef3 60%,#dfe2ea 100%);display:grid;place-items:center;overflow:hidden}
  .photo img{max-width:86%;max-height:220px;object-fit:contain;filter:drop-shadow(0 22px 26px rgba(20,25,40,.28))}
  .photo svg{width:78%;max-width:320px;filter:drop-shadow(0 24px 28px rgba(20,25,40,.30))}
  .pill{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;background:#fff;color:#16181d;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,195,142,.2)}
  .pill.busy i{background:var(--bad);box-shadow:0 0 0 3px rgba(255,77,94,.2)}
  .tag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;letter-spacing:.04em;padding:6px 10px;border-radius:8px;background:#16181d;color:#fff}
  .pbody{padding:16px 18px 18px}
  .pbody h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .pbody .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
  .rates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .rate{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
  .rate small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .rate b{display:block;font-size:15.5px;font-weight:800;margin-top:3px;letter-spacing:-.02em;white-space:nowrap}
  .rate b em{font-style:normal;color:var(--muted);font-size:12px;font-weight:600}
  .rate.we b{color:var(--gold)}
  .rate.sp{grid-column:1/-1;background:linear-gradient(135deg,rgba(47,140,255,.16),rgba(47,140,255,.06));border-color:rgba(47,140,255,.35)}
  .rate.sp b{color:var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:12px;font-weight:600;color:#c7cedb;background:var(--card2);border:1px solid var(--line);padding:6px 10px;border-radius:10px}

  /* availability */
  .avail{margin:12px 16px 0;display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:16px;background:rgba(34,195,142,.08);border:1px solid rgba(34,195,142,.28)}
  .avail .ic{width:36px;height:36px;border-radius:11px;background:rgba(34,195,142,.16);display:grid;place-items:center;font-size:17px;flex:none}
  .avail small{display:block;color:var(--muted);font-size:12px}
  .avail b{font-size:14.5px}

  /* sections */
  .sec{margin:22px 16px 0}
  .sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sec-h h3{font-size:17px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .sec-h h3 .n{width:22px;height:22px;border-radius:7px;background:var(--blue);color:#fff;font-size:12px;display:grid;place-items:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head b{font-size:16px;font-weight:800}
  .nav{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:18px;cursor:pointer}
  .nav:disabled{opacity:.25}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{text-align:center;font-size:11px;font-weight:700;color:var(--dim);padding:2px 0 6px;text-transform:uppercase}
  .dow.we{color:#8a6a35}
  .day{position:relative;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14.5px;cursor:pointer;transition:transform .1s,background .15s}
  .day:active{transform:scale(.93)}
  .day .pr{font-size:9.5px;font-weight:600;color:var(--muted);margin-top:1px;letter-spacing:-.01em}
  .day.free{background:var(--card2)}
  .day.free.wkend .pr{color:var(--gold)}
  .day.free.spc .pr{color:var(--blue)}
  .day.past{color:#2c3240;cursor:default}
  .day.busy{background:rgba(255,77,94,.10);color:rgba(255,77,94,.55);cursor:not-allowed}
  .day.busy::after{content:"";position:absolute;inset:9px 11px;background:
      linear-gradient(45deg,transparent calc(50% - 1px),rgba(255,77,94,.85) calc(50% - 1px),rgba(255,77,94,.85) calc(50% + 1px),transparent calc(50% + 1px)),
      linear-gradient(-45deg,transparent calc(50% - 1px),rgba(255,77,94,.85) calc(50% - 1px),rgba(255,77,94,.85) calc(50% + 1px),transparent calc(50% + 1px))}
  .day.busy .pr{display:none}
  .day.ret{background:var(--card2);color:var(--text);outline:1.5px dashed rgba(47,140,255,.6);outline-offset:-2px}
  .day.ret::after{display:none}
  .day.ret .pr{display:block;color:var(--blue)}
  .day.inr{background:rgba(47,140,255,.22);color:#fff}
  .day.inr .pr{color:#cfe2ff}
  .day.sel{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(47,140,255,.4)}
  .day.sel .pr{color:#e6f0ff}
  .day.today::before{content:"";position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
  .day.sel.today::before{background:#fff}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px}

  /* form */
  .field{position:relative;margin-bottom:10px}
  .field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
  .field.ta svg{top:19px;transform:none}
  .field input,.field textarea{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:14px 14px 14px 44px;font-size:15px;outline:none;font-family:inherit}
  .field textarea{resize:none}
  .field input::placeholder,.field textarea::placeholder{color:var(--dim)}
  .field input:focus,.field textarea:focus{border-color:var(--blue)}
  .share{width:100%;display:none;align-items:center;justify-content:center;gap:8px;margin:-2px 0 10px;padding:12px;border-radius:14px;border:1.5px dashed rgba(47,140,255,.5);background:rgba(47,140,255,.08);color:var(--blue);font-size:14px;font-weight:700;cursor:pointer}
  .share.done{border-style:solid;border-color:rgba(34,195,142,.4);background:rgba(34,195,142,.1);color:var(--ok)}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
  .seg button{border:0;background:transparent;color:var(--muted);padding:11px 6px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer}
  .seg button.active{background:var(--blue);color:#fff}

  /* summary */
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 0;color:var(--muted);font-size:14px}
  .row b{color:var(--text);font-weight:700;text-align:right}
  .calc{margin:8px 0 2px;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:13px;color:#c7cedb;font-variant-numeric:tabular-nums}
  .calc div{display:flex;justify-content:space-between;padding:3px 0}
  .calc div span:last-child{font-weight:700;color:var(--text)}
  .total{border-top:1px dashed rgba(255,255,255,.12);margin-top:8px;padding-top:12px}
  .total span{color:var(--text);font-weight:700;font-size:16px}
  .total b{font-size:23px;font-weight:800;color:var(--blue);letter-spacing:-.02em}
  .channel{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;cursor:pointer}
  .channel .ic{width:42px;height:42px;border-radius:12px;background:var(--blue);display:grid;place-items:center;font-size:19px;flex:none}
  .channel b{display:block;font-size:14px}.channel small{color:var(--muted);font-size:12px}
  .channel .go{margin-left:auto;color:var(--muted);font-size:22px}
  .trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .trust div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
  .trust div b{display:block;font-size:18px;margin-bottom:4px}
  .rules{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7;padding:0 4px}

  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent);display:none;z-index:5}
  .bar button{width:100%;padding:17px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(47,140,255,.35)}
  .bar button:disabled{background:var(--card3);color:var(--dim);box-shadow:none}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-140%);visibility:hidden;background:#1f2430;border:1px solid var(--line);padding:12px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:9;max-width:90%;transition:transform .25s}
  .toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
</style>
</head>

  en: { tagline:"PS5 rental in Tashkent — daily, easy and fast", chShort:"Channel", sub:"Console + 2 DualSense controllers + games",
        wd:"Mon – Fri", we:"Sat – Sun", sp:"Special price", perDay:"/ day", chips:["2 controllers","Top games","HDMI cable","Checked"],
        freeNow:"Open for booking", noFree:"No free days yet", availTitle:"Available", s1:"Pick your dates", s3:"Your details", s4:"Price breakdown",
        lFree:"Free", lBusy:"Booked", lSel:"Selected", lWe:"Weekend",
        hint0:"👆 Tap the pickup day", hint1:"↩️ Now tap the return day (days with a blue outline)", hint2:"✅ Done. Tap another day to change",
        name:"Full name", address:"Address: district, street, landmark", comment:"Comment: which games, time…",
        share:"📱 Use my Telegram number", shared:"✅ Number added", pickup:"🏠 Pickup", delivery:"🚕 Delivery",
        rPick:"Pickup", rRet:"Return", rNights:"Days", rDelivery:"Delivery", negotiable:"negotiable", rTotal:"Total",
        chSub:"News, discounts and free dates", t1:"Checked console", t2:"Fast confirmation", t3:"Games installed",
        rules:"• 1 day = 24 hours. The price depends on the day the 24h period starts.<br>• ID or a deposit is required at pickup.<br>• After ordering, the admin will contact you to confirm.",
        nights:"days", som:"UZS", from:"from", until:"until", agreed:"by agreement",
        btnPick:"Pick the pickup day", btnEnd:"Pick the return day", btnOrder:"Place order",
        eRange:"Booked days in range — pick another date", eDays:"Pick your dates first", eName:"Enter your full name", ePhone:"Enter a valid phone number", eAddr:"Enter your address",
        months:["January","February","March","April","May","June","July","August","September","October","November","December"], dow:["Mo","Tu","We","Th","Fr","Sa","Su"] },
};

/* Umumiy geympad illyustratsiyasi (o'z suratingiz bo'lmasa ko'rinadi) */
const PAD_SVG = `<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe3ea"/></linearGradient>
  <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3140"/><stop offset="1" stop-color="#11141b"/></linearGradient>
  <radialGradient id="gs" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#3a4152"/><stop offset="1" stop-color="#151922"/></radialGradient>
 </defs>
 <path d="M118 52c-30 0-52 18-62 50L28 196c-8 28 8 50 34 50 18 0 30-10 42-28l20-30h152l20 30c12 18 24 28 42 28 26 0 42-22 34-50l-28-94c-10-32-32-50-62-50z" fill="url(#gw)" stroke="#c9ced8" stroke-width="2"/>
 <path d="M140 60h120c14 0 22 8 22 20v34c0 10-8 18-18 18H136c-10 0-18-8-18-18V80c0-12 8-20 22-20z" fill="url(#gd)"/>
 <path d="M150 70h100" stroke="#3d7bff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
 <g fill="#2a2f3b"><rect x="80" y="94" width="14" height="40" rx="3"/><rect x="67" y="107" width="40" height="14" rx="3"/></g>
 <g><circle cx="318" cy="94" r="9" fill="#2a2f3b"/><circle cx="298" cy="114" r="9" fill="#2a2f3b"/><circle cx="338" cy="114" r="9" fill="#2a2f3b"/><circle cx="318" cy="134" r="9" fill="#2a2f3b"/></g>
 <circle cx="152" cy="168" r="24" fill="url(#gs)"/><circle cx="152" cy="168" r="15" fill="#20252f"/>
 <circle cx="248" cy="168" r="24" fill="url(#gs)"/><circle cx="248" cy="168" r="15" fill="#20252f"/>
 <circle cx="200" cy="152" r="7" fill="#c9ced8"/>
 <rect x="108" y="76" width="8" height="4" rx="2" fill="#9aa2b1"/><rect x="284" y="76" width="8" height="4" rx="2" fill="#9aa2b1"/>
</svg>`;

const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
const params = new URLSearchParams(location.search);
const tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
const LANG = I18N[params.get("lang")] ? params.get("lang") : (I18N[tgLang] ? tgLang : "uz");
const L = I18N[LANG]; document.documentElement.lang = LANG;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseIso(s); d.setDate(d.getDate()+n); return iso(d); };
const num = n => Math.round(n).toLocaleString("ru-RU").replace(/[\s, ]/g," ");
const fmt = n => num(n) + " " + L.som;
const short = n => n >= 1000 ? Math.round(n/1000) + "k" : String(n);
const human = s => { const d = parseIso(s); return d.getDate()+" "+L.months[d.getMonth()].slice(0,3).toLowerCase()+", "+L.dow[(d.getDay()+6)%7]; };
const haptic = t => { try { t==="sel" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.notificationOccurred(t); } catch(e){} };

/* ---------- ma'lumot (bot URL orqali yuboradi) ---------- */
const WD = +params.get("wd") || DEFAULTS.wd, WE = +params.get("we") || DEFAULTS.we;
const SPECIAL = {};
(params.get("sp") ?? DEFAULTS.sp).split(",").filter(Boolean).forEach(x => { const [d,v] = x.split(":"); if (d && +v) SPECIAL[d] = +v; });
const booked = new Set((params.get("ps5") || "").split(",").filter(Boolean));
let OPEN = null; // {from:"YYYY-MM-DD", fromT:"HH:MM", to:"YYYY-MM-DD", toT:"HH:MM"}
const openRaw = params.get("open") ?? DEFAULTS.open;
if (openRaw && openRaw.includes("..")) { const [a,b] = openRaw.split(".."); OPEN = { from:a.slice(0,10), fromT:a.slice(11,16), to:b.slice(0,10), toT:b.slice(11,16) }; }
if (!inTelegram && !location.search) { // brauzer sinovi: namunaviy holat
  const t = new Date(); [3,4,9].forEach(k => { const d = new Date(t); d.setDate(t.getDate()+k); booked.add(iso(d)); });
}

const today = new Date(); today.setHours(0,0,0,0);
const TODAY = iso(today);
const priceOf = d => SPECIAL[d] ?? ([0,6].includes(parseIso(d).getDay()) ? WE : WD);
const isWeekend = d => [0,6].includes(parseIso(d).getDay());
const nightFree = d => d >= TODAY && !booked.has(d) && !(OPEN && (d < OPEN.from || d >= OPEN.to));

const firstFree = (() => { for (let i=0;i<400;i++){ const d = addDays(TODAY,i); if (nightFree(d)) return d; } return null; })();
const state = { start:null, end:null, delivery:"pickup",
  view: firstFree ? new Date(parseIso(firstFree).getFullYear(), parseIso(firstFree).getMonth(), 1) : new Date(today.getFullYear(), today.getMonth(), 1) };

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); haptic("warning"); }

/* end tanlash mumkin bo'lgan kunlar: start dan keyin, oraliqdagi barcha sutkalar bo'sh */
function returnable(start){
  const out = new Set(); let d = start;
  for (let i=0;i<400 && nightFree(d);i++){ d = addDays(d,1); out.add(d); }
  return out;
}
const nightsOf = (s,e) => { const out=[]; for (let d=s; d<e; d=addDays(d,1)) out.push(d); return out; };

/* ---------- render ---------- */
function renderStatic(){
  document.querySelectorAll("[data-i]").forEach(el => { if (L[el.dataset.i] !== undefined) el.textContent = L[el.dataset.i]; });
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = L[el.dataset.ph]);
  document.querySelectorAll("[data-html]").forEach(el => el.innerHTML = L[el.dataset.html]);
  const img = new Image(); img.alt = "";
  img.onload = () => $("photo").appendChild(img);
  img.onerror = () => $("photo").insertAdjacentHTML("beforeend", PAD_SVG);
  img.src = DEFAULTS.photo;
  const futureSp = Object.keys(SPECIAL).filter(d => d >= TODAY).sort();
  let rates = `<div class="rate"><small>${L.wd}</small><b>${fmt(WD)} <em>${L.perDay}</em></b></div>
               <div class="rate we"><small>${L.we}</small><b>${fmt(WE)} <em>${L.perDay}</em></b></div>`;
  if (futureSp.length) {
    const vals = [...new Set(futureSp.map(d => SPECIAL[d]))];
    const range = futureSp.length > 1 ? `${parseIso(futureSp[0]).getDate()}–${human(futureSp.at(-1)).split(",")[0]}` : human(futureSp[0]).split(",")[0];
    rates += `<div class="rate sp"><small>⭐ ${L.sp} · ${range}</small><b>${vals.map(fmt).join(" / ")} <em>${L.perDay}</em></b></div>`;
  }
  $("rates").innerHTML = rates;
  $("chips").innerHTML = L.chips.map(c => `<span class="chip">${c}</span>`).join("");
  $("pillTxt").textContent = firstFree ? L.freeNow : L.noFree;
  $("pill").classList.toggle("busy", !firstFree);
  if (OPEN) {
    $("avail").style.display = "flex";
    $("availTxt").textContent = `${human(OPEN.from)} ${OPEN.fromT}  →  ${human(OPEN.to)} ${OPEN.toT}`;
  }
}

function renderCalendar(){
  const v = state.view, y = v.getFullYear(), m = v.getMonth();
  $("monthTitle").textContent = L.months[m] + " " + y;
  const minV = new Date(today.getFullYear(), today.getMonth(), 1);
  const maxV = new Date(today.getFullYear(), today.getMonth()+DEFAULTS.monthsAhead-1, 1);
  $("prev").disabled = v <= minV; $("next").disabled = v >= maxV;
  const first = (new Date(y,m,1).getDay()+6)%7, days = new Date(y,m+1,0).getDate();
  const ret = state.start && !state.end ? returnable(state.start) : new Set();
  const inRange = new Set(state.start && state.end ? nightsOf(state.start, state.end) : []);
  let html = L.dow.map((d,i)=>`<div class="dow ${i>4?"we":""}">${d}</div>`).join("");
  for (let i=0;i<first;i++) html += "<div></div>";
  for (let d=1; d<=days; d++){
    const s = iso(new Date(y,m,d)); const p = priceOf(s);
    let cls = "day", click = false;
    if (s < TODAY) cls += " past";
    else if (s === state.start || s === state.end) { cls += " sel"; click = true; }
    else if (inRange.has(s)) { cls += " inr"; click = true; }
    else if (ret.has(s) && !nightFree(s)) { cls += " ret"; click = true; }
    else if (nightFree(s)) { cls += " free"; click = true; if (s in SPECIAL) cls += " spc"; else if (isWeekend(s)) cls += " wkend"; }
    else cls += " busy";
    if (s === TODAY) cls += " today";
    const showPr = s >= TODAY && (nightFree(s));
    html += `<div class="${cls}" ${click?`data-d="${s}"`:""}>${d}${showPr?`<span class="pr">${short(p)}</span>`:(cls.includes(" ret")?`<span class="pr">↩</span>`:"")}</div>`;
  }
  $("grid").innerHTML = html;
  document.querySelectorAll(".day[data-d]").forEach(el => el.onclick = () => pickDay(el.dataset.d));
  $("hint").textContent = !state.start ? L.hint0 : (!state.end ? L.hint1 : L.hint2);
}

function pickDay(s){
  haptic("sel");
  if (!state.start || state.end) {                      // yangi tanlov
    if (!nightFree(s)) return;
    state.start = s; state.end = null;
  } else if (s === state.start) {                        // shu kunni yana bosdi → 1 sutka
    state.end = addDays(s,1);
  } else if (s < state.start) {
    if (nightFree(s)) { state.start = s; state.end = null; }
  } else {
    if (returnable(state.start).has(s)) state.end = s;
    else { toast(L.eRange); if (nightFree(s)) { state.start = s; state.end = null; } }
  }
  renderCalendar(); renderSummary();
}

function calc(){
  if (!state.start || !state.end) return { nights:[], total:0, groups:[] };
  const n = nightsOf(state.start, state.end);
  const groups = {};
  n.forEach(d => { const p = priceOf(d); const k = (d in SPECIAL) ? "sp" : (isWeekend(d) ? "we" : "wd"); const key = k+":"+p; groups[key] = groups[key] || {k, p, c:0}; groups[key].c++; });
  return { nights:n, total:n.reduce((a,d)=>a+priceOf(d),0), groups:Object.values(groups) };
}

function timeFor(date, edge){
  const t = (word, hm) => LANG === "uz" ? `${hm} ${word}` : `${word} ${hm}`;
  if (OPEN && edge==="start" && date === OPEN.from) return "· " + t(L.from, OPEN.fromT);
  if (OPEN && edge==="end" && date === OPEN.to) return "· " + t(L.until, OPEN.toT);
  return "";
}

function renderSummary(){
  const c = calc();
  $("sPick").textContent = state.start ? `${human(state.start)} ${timeFor(state.start,"start")}`.trim() : "—";
  $("sRet").textContent = state.end ? `${human(state.end)} ${timeFor(state.end,"end")}`.trim() : "—";
  $("sNights").textContent = c.nights.length + " " + L.nights;
  if (c.nights.length) {
    $("calc").style.display = "block";
    $("calc").innerHTML = c.groups.map(g => `<div><span>${g.c} × ${fmt(g.p)} <small style="color:var(--muted)">(${g.k==="sp"?"⭐ "+L.sp:(g.k==="we"?L.we:L.wd)})</small></span><span>${fmt(g.c*g.p)}</span></div>`).join("");
  } else $("calc").style.display = "none";
  $("sDeliveryRow").style.display = state.delivery==="delivery" ? "" : "none";
  $("sTotal").textContent = fmt(c.total);
  const label = c.nights.length ? `${L.btnOrder}  •  ${fmt(c.total)}` : (state.start ? L.btnEnd : L.btnPick);
  if (inTelegram) {
    tg.MainButton.setText(label);
    if (c.nights.length) { tg.MainButton.enable(); tg.MainButton.color = "#2f8cff"; tg.MainButton.textColor = "#ffffff"; }
    else { tg.MainButton.disable(); tg.MainButton.color = "#252b38"; tg.MainButton.textColor = "#6b7488"; }
    tg.MainButton.show();
  } else { $("bar").style.display = "block"; $("fallbackBtn").textContent = label; $("fallbackBtn").disabled = !c.nights.length; }
}

function submit(){
  const c = calc();
  const name = $("name").value.trim(), phone = $("phone").value.trim(), address = $("address").value.trim();
  if (!c.nights.length) return toast(L.eDays);
  if (name.length < 2) { $("name").focus(); return toast(L.eName); }
  if (phone.replace(/\D/g,"").length < 9) { $("phone").focus(); return toast(L.ePhone); }
  if (state.delivery==="delivery" && address.length < 5) { $("address").focus(); return toast(L.eAddr); }
  haptic("success");
  const order = { lang:LANG, product:"ps5", start:state.start, end:state.end, days:c.nights.length,
                  delivery:state.delivery, address, name, phone, comment:$("comment").value.trim().slice(0,300), total:c.total };
  if (inTelegram) tg.sendData(JSON.stringify(order));
  else alert("Brauzerda sinov rejimi. Telegram ichida bu buyurtma botga yuboriladi:\n\n" + JSON.stringify(order, null, 2));
}

/* ---------- hodisalar ---------- */
$("prev").onclick = () => { state.view = new Date(state.view.getFullYear(), state.view.getMonth()-1, 1); renderCalendar(); };
$("next").onclick = () => { state.view = new Date(state.view.getFullYear(), state.view.getMonth()+1, 1); renderCalendar(); };
document.querySelectorAll("#deliverySeg button").forEach(b => b.onclick = () => {
  haptic("sel");
  document.querySelectorAll("#deliverySeg button").forEach(x => x.classList.toggle("active", x===b));
  state.delivery = b.dataset.v; $("addressBox").style.display = state.delivery==="delivery" ? "" : "none"; renderSummary();
});
$("fallbackBtn").onclick = submit;
["channelCard","chTop"].forEach(id => $(id).onclick = e => { if (inTelegram && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink("https://t.me/ps_5_gta_6"); } });

const shareBtn = $("shareBtn");
if (inTelegram && typeof tg.requestContact === "function") {
  shareBtn.textContent = L.share; shareBtn.style.display = "flex";
  shareBtn.onclick = () => {
    haptic("sel");
    tg.requestContact((ok, res) => {
      const c = res && res.responseUnsafe && res.responseUnsafe.contact;
      if (ok && c && c.phone_number) {
        const ph = String(c.phone_number); $("phone").value = ph.startsWith("+") ? ph : "+" + ph;
        if (!$("name").value.trim()) $("name").value = [c.first_name, c.last_name].filter(Boolean).join(" ");
      }
      if (ok) { shareBtn.textContent = L.shared; shareBtn.classList.add("done"); haptic("success"); }
    });
  };
}

if (inTelegram) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#0b0d12"); tg.setBackgroundColor("#0b0d12"); tg.setBottomBarColor && tg.setBottomBarColor("#0b0d12"); } catch(e){}
  tg.MainButton.onClick(submit);
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) $("name").value = [u.first_name, u.last_name].filter(Boolean).join(" ");
}
renderStatic(); renderCalendar(); renderSummary();
</script>
</body>
