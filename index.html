<style>
  :root{
    --bg:#07080d; --surface:#10131c; --surface2:#171b27; --surface3:#1e2333;
    --text:#f5f7fb; --muted:#8a93a8; --dim:#4b5366; --line:rgba(255,255,255,.07);
    --blue:#3d7bff; --cyan:#3fd0ff; --violet:#8b5cff; --ok:#2dd4a0; --bad:#ff5a6a;
    --grad:linear-gradient(135deg,#3d7bff 0%,#8b5cff 100%);
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
  html{background:var(--bg)}
  body{color:var(--text);font:15px/1.45 "Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(120px + env(safe-area-inset-bottom));
       background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,255,.22),transparent 60%),radial-gradient(700px 500px at -10% 10%,rgba(61,123,255,.20),transparent 60%),var(--bg);min-height:100vh}
  button{font-family:inherit}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em}
  .logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 20px rgba(61,123,255,.45)}
  .logo svg{width:18px;height:18px}
  .city{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:999px}

  /* ---------- hero ---------- */
  .hero{margin:12px 16px 0;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(160deg,#151a2b 0%,#0c0f18 100%);border:1px solid var(--line)}
  .hero-media{height:230px;position:relative;display:grid;place-items:center;overflow:hidden}
  .hero-media::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(61,123,255,.55),rgba(139,92,255,.15) 55%,transparent 70%);filter:blur(10px)}
  .hero-media img{position:relative;max-width:88%;max-height:210px;object-fit:contain;filter:drop-shadow(0 25px 35px rgba(0,0,0,.6));transition:opacity .25s}
  .hero-media .ph{position:relative;font-size:88px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
  .badge{position:absolute;top:14px;left:14px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(45,212,160,.14);color:var(--ok);border:1px solid rgba(45,212,160,.3);z-index:2}
  .badge.busy{background:rgba(255,90,106,.12);color:var(--bad);border-color:rgba(255,90,106,.3)}
  .hero-body{padding:4px 20px 20px}
  .hero-title{font-size:26px;font-weight:800;letter-spacing:-.03em}
  .hero-sub{color:var(--muted);font-size:14px;margin-top:2px}
  .hero-price{display:flex;align-items:baseline;gap:6px;margin-top:12px}
  .hero-price b{font-size:28px;font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero-price span{color:var(--muted);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chip{font-size:12px;font-weight:600;color:#c9d1e3;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:6px 10px;border-radius:10px}

  /* ---------- product tabs ---------- */
  .tabs{display:flex;gap:8px;margin:14px 16px 0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1;min-width:130px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;transition:.2s}
  .tab.active{border-color:transparent;background:linear-gradient(var(--surface2),var(--surface2)) padding-box,var(--grad) border-box}
  .tab .thumb{width:40px;height:40px;border-radius:12px;background:var(--surface3);display:grid;place-items:center;overflow:hidden;flex:none;font-size:20px}
  .tab .thumb img{width:100%;height:100%;object-fit:cover}
  .tab .t-name{font-weight:700;font-size:13px}
  .tab .t-price{font-size:12px;color:var(--muted)}

  /* ---------- sections ---------- */
  .section{margin:22px 16px 0}
  .step{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .step .n{width:24px;height:24px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--cyan)}
  .step h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

  /* ---------- calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head b{font-size:16px;font-weight:800}
  .nav{background:var(--surface2);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;display:grid;place-items:center}
  .nav:disabled{opacity:.25}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
  .dow{font-size:11px;font-weight:700;color:var(--dim);padding:2px 0 6px;text-transform:uppercase}
  .day{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;position:relative;transition:background .15s,transform .1s}
  .day:active{transform:scale(.92)}
  .day.free{background:var(--surface2);color:var(--text)}
  .day.past{color:#2f3545;cursor:default}
  .day.booked{background:repeating-linear-gradient(135deg,rgba(255,90,106,.12) 0 6px,rgba(255,90,106,.05) 6px 12px);color:rgba(255,90,106,.75);cursor:not-allowed}
  .day.sel{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(61,123,255,.45)}
  .day.inrange{background:rgba(61,123,255,.22);color:#fff}
  .day.today::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--cyan)}
  .day.sel.today::after{background:#fff}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:6px;vertical-align:-1px}
  .hint{font-size:13px;color:var(--muted);margin-top:10px;display:flex;gap:8px;align-items:flex-start}

  /* ---------- addon ---------- */
  .addon{display:flex;align-items:center;gap:12px;cursor:pointer}
  .addon .thumb{width:48px;height:48px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;font-size:22px;flex:none}
  .addon .thumb img{width:100%;height:100%;object-fit:cover}
  .addon .txt{flex:1}
  .addon .txt b{display:block;font-size:15px}
  .addon .txt small{color:var(--muted);font-size:13px}
  .switch{width:50px;height:30px;border-radius:999px;background:var(--surface3);position:relative;transition:.2s;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .addon input{display:none}
  .addon input:checked + .switch{background:var(--grad)}
  .addon input:checked + .switch::after{left:23px}

  /* ---------- form ---------- */
  .field{position:relative;margin-bottom:10px}
  .field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
  .field.ta svg{top:20px;transform:none}
  .field input,.field textarea{width:100%;background:var(--surface2);border:1.5px solid transparent;color:var(--text);border-radius:14px;padding:14px 14px 14px 44px;font-size:15px;outline:none;font-family:inherit;transition:.15s}
  .field textarea{resize:none}
  .field input::placeholder,.field textarea::placeholder{color:var(--dim)}
  .field input:focus,.field textarea:focus{border-color:var(--blue);background:var(--surface3)}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
  .seg button{border:0;background:transparent;color:var(--muted);padding:11px 6px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
  .seg button.active{background:var(--surface3);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.35)}

  .share{width:100%;display:none;align-items:center;justify-content:center;gap:8px;margin:-2px 0 10px;padding:12px;border-radius:14px;border:1.5px dashed rgba(63,208,255,.45);background:rgba(63,208,255,.08);color:var(--cyan);font-size:14px;font-weight:700;cursor:pointer}
  .share.done{border-style:solid;border-color:rgba(45,212,160,.4);background:rgba(45,212,160,.1);color:var(--ok)}
  .channel{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(61,123,255,.15),rgba(139,92,255,.15));border:1px solid rgba(139,92,255,.3);cursor:pointer;text-decoration:none;color:var(--text)}
  .channel .ic{width:42px;height:42px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:20px;flex:none}
  .channel b{display:block;font-size:14px}.channel small{color:var(--muted);font-size:12px}
  .channel .go{margin-left:auto;color:var(--cyan);font-size:20px}
  /* ---------- summary ---------- */
  .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;color:var(--muted);font-size:14px}
  .row b{color:var(--text);font-weight:700;text-align:right}
  .total{border-top:1px dashed rgba(255,255,255,.12);margin-top:8px;padding-top:14px}
  .total span{color:var(--text);font-weight:700;font-size:16px}
  .total b{font-size:22px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .trust div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
  .trust div b{display:block;font-size:18px;margin-bottom:4px}
  .rules{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7;padding:0 4px}

  /* ---------- bottom bar (browser fallback) ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent);display:none}
  .bar button{width:100%;padding:17px;border:0;border-radius:16px;background:var(--grad);color:#fff;font-size:16px;font-weight:800;box-shadow:0 10px 30px rgba(61,123,255,.4);cursor:pointer}
  .bar button:disabled{background:var(--surface3);color:var(--dim);box-shadow:none}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120%);background:rgba(30,35,51,.95);backdrop-filter:blur(10px);border:1px solid var(--line);padding:12px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:9;max-width:90%;transition:transform .25s}
  .toast{visibility:hidden}
  .toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
</style>
</head>

        lFree:"Свободно", lBusy:"Занято", lSel:"Выбрано", hint:"👆 Нажмите день начала, затем день окончания. На 1 день — нажмите день дважды.",
        addon:"Третий геймпад", name:"Ваше имя", address:"Адрес: район, улица, ориентир", comment:"Комментарий: какие игры нужны, время…",
        pickup:"🏠 Самовывоз", delivery:"🚕 Доставка", rProduct:"Товар", rDates:"Даты", rDays:"Срок",
        rDelivery:"Доставка", rTotal:"Итого", t1:"Проверенная консоль", t2:"Быстрое подтверждение", t3:"Игры установлены",
        rules:"• 1 сутки = 24 часа.<br>• При получении нужен паспорт или залог.<br>• После заказа администратор свяжется с вами для подтверждения.",
        days:"дн.", som:"сум", negotiable:"по договорённости", freeToday:"● Сегодня свободна", busyToday:"● Сегодня занята",
        btnPick:"Выберите даты", btnEnd:"Выберите дату окончания", btnOrder:"Оформить заказ",
        eRange:"В диапазоне есть занятые дни — выберите другие даты", eMax:"Максимум {n} дней", eDays:"Сначала выберите даты",
        eName:"Укажите имя", ePhone:"Укажите правильный номер телефона", eAddr:"Укажите адрес",
        months:["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"], dow:["Пн","Вт","Ср","Чт","Пт","Сб","Вс"] },
  en: { city:"📍 Tashkent", share:"📱 Use my Telegram number", shared:"✅ Number added", chSub:"News, discounts and free dates",  perDay:"/ day", s1:"Pick your dates", s2:"Extras", s3:"Your details", s4:"Order",
        lFree:"Free", lBusy:"Booked", lSel:"Selected", hint:"👆 Tap the start day, then the end day. For 1 day — tap the same day twice.",
        addon:"Third controller", name:"Your name", address:"Address: district, street, landmark", comment:"Comment: which games, what time…",
        pickup:"🏠 Pickup", delivery:"🚕 Delivery", rProduct:"Item", rDates:"Dates", rDays:"Duration",
        rDelivery:"Delivery", rTotal:"Total", t1:"Checked console", t2:"Fast confirmation", t3:"Games installed",
        rules:"• 1 day = 24 hours.<br>• ID or a deposit is required at pickup.<br>• After ordering, the admin will contact you to confirm.",
        days:"days", som:"UZS", negotiable:"negotiable", freeToday:"● Free today", busyToday:"● Booked today",
        btnPick:"Pick your dates", btnEnd:"Pick the end date", btnOrder:"Place order",
        eRange:"Booked days in range — pick other dates", eMax:"Maximum {n} days", eDays:"Pick your dates first",
        eName:"Enter your name", ePhone:"Enter a valid phone number", eAddr:"Enter your address",
        months:["January","February","March","April","May","June","July","August","September","October","November","December"], dow:["Mo","Tu","We","Th","Fr","Sa","Su"] },
};

const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
const params = new URLSearchParams(location.search);
const tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
const LANG = I18N[params.get("lang")] ? params.get("lang") : (I18N[tgLang] ? tgLang : "uz");
const L = I18N[LANG];
document.documentElement.lang = LANG;
const MONTHS = L.months, DOW = L.dow;
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("ru-RU").replace(/[\s,]/g," ") + " " + L.som;
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const human = s => { const d = parseIso(s); return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3).toLowerCase(); };
const haptic = t => { try { t==="sel" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.notificationOccurred(t); } catch(e){} };
const imgTag = (p, cls="") => `<img class="${cls}" src="${p.img}" alt="" onerror="this.outerHTML='<span class=&quot;ph&quot;>${p.emoji}</span>'">`;

// Band kunlar bot tomonidan URL orqali keladi: ?ps5=2026-11-20,2026-11-21&pult=...&lang=uz
const booked = {};
CONFIG.products.forEach(p => booked[p.id] = new Set((params.get(p.id) || "").split(",").filter(Boolean)));
if (!inTelegram && !params.get("ps5") && !params.get("pult")) { // brauzerda ko'rish uchun namunaviy band kunlar
  const t = new Date(); [2,3,7].forEach(k => { const d = new Date(t); d.setDate(t.getDate()+k); booked.ps5.add(iso(d)); });
}

const today = new Date(); today.setHours(0,0,0,0);
const state = { product: CONFIG.products[0].id, start: null, end: null, view: new Date(today.getFullYear(), today.getMonth(), 1), delivery: "pickup" };
const cur = () => CONFIG.products.find(x => x.id === state.product);

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); haptic("warning"); }

function renderHero(){
  const p = cur();
  $("heroMedia").innerHTML = imgTag(p);
  $("heroTitle").textContent = p.name[LANG];
  $("heroSub").textContent = p.sub[LANG];
  $("heroPrice").textContent = fmt(p.price);
  $("heroChips").innerHTML = p.chips[LANG].map(c => `<span class="chip">${c}</span>`).join("");
  const busyToday = booked[p.id].has(iso(today));
  $("badge").textContent = busyToday ? L.busyToday : L.freeToday;
  $("badge").classList.toggle("busy", busyToday);
}

function renderProducts(){
  $("products").innerHTML = CONFIG.products.map(p => `
    <div class="tab ${p.id===state.product?"active":""}" data-id="${p.id}">
      <div class="thumb">${imgTag(p)}</div>
      <div><div class="t-name">${p.short[LANG]}</div><div class="t-price">${fmt(p.price)}</div></div>
    </div>`).join("");
  document.querySelectorAll(".tab").forEach(el => el.onclick = () => {
    if (state.product === el.dataset.id) return;
    state.product = el.dataset.id; state.start = state.end = null; haptic("sel"); renderAll();
  });
  const showAddon = state.product === "ps5";
  $("addonsBox").style.display = showAddon ? "" : "none";
  $("formStep").textContent = showAddon ? 3 : 2;
  $("sumStep").textContent = showAddon ? 4 : 3;
}

function selectedDates(){
  if (!state.start) return [];
  const end = state.end || state.start, out = [];
  for (let d = parseIso(state.start); d <= parseIso(end); d.setDate(d.getDate()+1)) out.push(iso(d));
  return out;
}

function renderCalendar(){
  const v = state.view, y = v.getFullYear(), m = v.getMonth();
  $("monthTitle").textContent = MONTHS[m] + " " + y;
  const minView = new Date(today.getFullYear(), today.getMonth(), 1);
  const maxView = new Date(today.getFullYear(), today.getMonth()+CONFIG.monthsAhead-1, 1);
  $("prev").disabled = v <= minView; $("next").disabled = v >= maxView;
  const first = (new Date(y,m,1).getDay()+6)%7, days = new Date(y,m+1,0).getDate();
  const sel = new Set(selectedDates()), bk = booked[state.product];
  let html = DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for (let i=0;i<first;i++) html += "<div></div>";
  for (let d=1; d<=days; d++){
    const date = new Date(y,m,d), s = iso(date);
    let cls = "day";
    if (date < today) cls += " past";
    else if (bk.has(s)) cls += " booked";
    else if (s===state.start || s===state.end) cls += " sel";
    else if (sel.has(s)) cls += " inrange";
    else cls += " free";
    if (date.getTime()===today.getTime()) cls += " today";
    html += `<div class="${cls}" data-d="${s}">${d}</div>`;
  }
  $("grid").innerHTML = html;
  document.querySelectorAll(".day.free,.day.sel,.day.inrange").forEach(el => el.onclick = () => pickDay(el.dataset.d));
}

function pickDay(s){
  haptic("sel");
  if (!state.start || state.end) { state.start = s; state.end = null; }
  else if (s === state.start) { state.end = s; }
  else {
    let a = state.start, b = s; if (b < a) [a,b] = [b,a];
    state.start = a; state.end = b;
    const range = selectedDates();
    if (range.some(d => booked[state.product].has(d))) { toast(L.eRange); state.start = s; state.end = null; }
    else if (range.length > CONFIG.maxDays) { toast(L.eMax.replace("{n}", CONFIG.maxDays)); state.start = s; state.end = null; }
  }
  renderCalendar(); renderSummary();
}

function calc(){
  const p = cur();
  const days = state.end ? selectedDates().length : 0;
  const extra = state.product==="ps5" && $("extraPult").checked;
  const addon = extra ? CONFIG.extraPultPrice*days : 0;
  const deliv = state.delivery==="delivery" ? CONFIG.deliveryPrice : 0;
  return { p, days, extra, addon, total: p.price*days + addon + deliv };
}

function renderSummary(){
  const c = calc();
  $("sProduct").textContent = c.p.name[LANG];
  $("sDates").textContent = !state.start ? "—" : (state.end ? (state.start===state.end ? human(state.start) : human(state.start)+" → "+human(state.end)) : human(state.start)+" → ?");
  $("sDays").textContent = c.days + " " + L.days;
  $("sAddonRow").style.display = c.extra ? "" : "none"; $("sAddon").textContent = fmt(c.addon);
  $("sDeliveryRow").style.display = state.delivery==="delivery" ? "" : "none";
  $("sDelivery").textContent = CONFIG.deliveryPrice ? fmt(CONFIG.deliveryPrice) : L.negotiable;
  $("sTotal").textContent = fmt(c.total);
  const label = c.days ? `${L.btnOrder}  •  ${fmt(c.total)}` : (state.start ? L.btnEnd : L.btnPick);
  if (inTelegram) {
    tg.MainButton.setText(label);
    if (c.days) { tg.MainButton.enable(); tg.MainButton.color = "#3d7bff"; tg.MainButton.textColor = "#ffffff"; }
    else { tg.MainButton.disable(); tg.MainButton.color = "#1e2333"; tg.MainButton.textColor = "#6b7488"; }
    tg.MainButton.show();
  } else { $("bar").style.display="block"; $("fallbackBtn").textContent=label; $("fallbackBtn").disabled=!c.days; }
}

function renderAll(){ renderHero(); renderProducts(); renderCalendar(); renderSummary(); }

function submit(){
  const c = calc();
  const name = $("name").value.trim(), phone = $("phone").value.trim(), address = $("address").value.trim();
  if (!c.days) return toast(L.eDays);
  if (name.length < 2) { $("name").focus(); return toast(L.eName); }
  if (phone.replace(/\D/g,"").length < 9) { $("phone").focus(); return toast(L.ePhone); }
  if (state.delivery==="delivery" && address.length < 5) { $("address").focus(); return toast(L.eAddr); }
  haptic("success");
  const order = {
    lang: LANG, product: c.p.id, start: state.start, end: state.end, days: c.days,
    extra_pult: c.extra, delivery: state.delivery, address,
    name, phone, comment: $("comment").value.trim().slice(0,300), total: c.total
  };
  if (inTelegram) tg.sendData(JSON.stringify(order));
  else alert("Brauzerda sinov rejimi. Telegram ichida bu buyurtma botga yuboriladi:\n\n" + JSON.stringify(order, null, 2));
}

// ---------- hodisalar ----------
$("prev").onclick = () => { state.view = new Date(state.view.getFullYear(), state.view.getMonth()-1, 1); renderCalendar(); };
$("next").onclick = () => { state.view = new Date(state.view.getFullYear(), state.view.getMonth()+1, 1); renderCalendar(); };
$("extraPult").onchange = () => { haptic("sel"); renderSummary(); };
$("addonPrice").textContent = fmt(CONFIG.extraPultPrice);
$("addonThumb").innerHTML = imgTag(CONFIG.products.find(p=>p.id==="pult"));
$("rules").innerHTML = L.rules;
document.querySelectorAll("[data-i]").forEach(el => { if (L[el.dataset.i] !== undefined) el.textContent = L[el.dataset.i]; });
document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = L[el.dataset.ph]);
document.querySelectorAll("#deliverySeg button").forEach(b => b.onclick = () => {
  haptic("sel");
  document.querySelectorAll("#deliverySeg button").forEach(x => x.classList.toggle("active", x===b));
  state.delivery = b.dataset.v; $("addressBox").style.display = state.delivery==="delivery" ? "" : "none"; renderSummary();
});
$("fallbackBtn").onclick = submit;

// Telefon: Telegram raqamini bir bosishda olish
const shareBtn = $("shareBtn");
shareBtn.textContent = L.share;
if (inTelegram && typeof tg.requestContact === "function") {
  shareBtn.style.display = "flex";
  shareBtn.onclick = () => {
    haptic("sel");
    tg.requestContact((ok, res) => {
      const c = res && res.responseUnsafe && res.responseUnsafe.contact;
      if (ok && c && c.phone_number) {
        const ph = String(c.phone_number);
        $("phone").value = ph.startsWith("+") ? ph : "+" + ph;
        if (!$("name").value.trim()) $("name").value = [c.first_name, c.last_name].filter(Boolean).join(" ");
        shareBtn.textContent = L.shared; shareBtn.classList.add("done"); haptic("success");
      } else if (ok) {
        shareBtn.textContent = L.shared; shareBtn.classList.add("done");
      }
    });
  };
}
// Kanal: Telegram ichida to'g'ridan-to'g'ri ochish
$("channelCard").onclick = (e) => { if (inTelegram && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink("https://t.me/ps_5_gta_6"); } };

if (inTelegram) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#07080d"); tg.setBackgroundColor("#07080d"); tg.setBottomBarColor && tg.setBottomBarColor("#07080d"); } catch(e){}
  tg.MainButton.onClick(submit);
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) $("name").value = [u.first_name, u.last_name].filter(Boolean).join(" ");
}
renderAll();
</script>
</body>
</html>
